# Generate the Xcode project with:  xcodegen generate
name: MacHelper
options:
  bundleIdPrefix: com.armanghev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  MacHelperCore:
    path: Packages/MacHelperCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  MacHelper:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: MacHelper
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Mac Helper
        PRODUCT_MODULE_NAME: MacHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.armanghev.MacHelper
        INFOPLIST_FILE: MacHelper/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: MacHelper/Resources/MacHelper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: MacHelperCore
        product: MacHelperCore
      - package: KeyboardShortcuts
      - package: Sparkle
      # The stdio bridge for Claude Desktop ships in Contents/MacOS.
      - target: machelper-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables

  machelper-mcp:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: MCPBridge
    settings:
      base:
        PRODUCT_NAME: machelper-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.armanghev.MacHelper.mcp
        SKIP_INSTALL: YES
    dependencies:
      - package: MacHelperCore
        product: MacHelperCore

schemes:
  MacHelper:
    build:
      targets:
        MacHelper: all
        machelper-mcp: all
    run:
      config: Debug
    archive:
      config: Release
