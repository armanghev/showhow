# Generate the Xcode project with:  xcodegen generate
name: ShowHow
options:
  bundleIdPrefix: com.armanghev
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  ShowHowCore:
    path: Packages/ShowHowCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  ShowHow:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ShowHow
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: ShowHow
        PRODUCT_MODULE_NAME: ShowHow
        PRODUCT_BUNDLE_IDENTIFIER: com.armanghev.ShowHow
        INFOPLIST_FILE: ShowHow/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ShowHow/Resources/ShowHow.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
    dependencies:
      - package: ShowHowCore
        product: ShowHowCore
      - package: KeyboardShortcuts
      - package: Sparkle
      # The stdio bridge for Claude Desktop ships in Contents/MacOS.
      - target: showhow-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables

  showhow-mcp:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: MCPBridge
    settings:
      base:
        PRODUCT_NAME: showhow-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.armanghev.ShowHow.mcp
        SKIP_INSTALL: YES
    dependencies:
      - package: ShowHowCore
        product: ShowHowCore

schemes:
  ShowHow:
    build:
      targets:
        ShowHow: all
        showhow-mcp: all
    run:
      config: Debug
    archive:
      config: Release
